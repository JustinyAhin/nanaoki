name = "nanaoki-site"
compatibility_date = "2026-11-16"
compatibility_flags = ["nodejs_als"]
main = ".svelte-kit/cloudflare/_worker.js"
workers_dev = true
preview_urls = true
routes = [
  { pattern = "nanaoki.com", custom_domain = true },
  { pattern = "www.nanaoki.com", custom_domain = true },
]

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
