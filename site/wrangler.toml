name = "nanaoki-site"
compatibility_date = "2026-11-01"
routes = [
  { pattern = "nanaoki.com", custom_domain = true },
  { pattern = "www.nanaoki.com", custom_domain = true },
]

[assets]
directory = "./"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 1
