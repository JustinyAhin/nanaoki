<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nanaoki social card v2-c: enso</title>
<!-- One brushed circle, made of many thin bristle paths. Render: site/og/render-v2.sh -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #f6f3ec; }
  canvas { display: block; width: 1200px; height: 630px; }
</style>
</head>
<body>
<canvas id="c" width="2400" height="1260"></canvas>
<script>
const W = 1200, H = 630, M = 60;
const INK = '27,26,23', ACCENT = '#c8402c';
const SERIF = '"Newsreader", Georgia, serif';
const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
const cv = document.getElementById('c');
const g = cv.getContext('2d');
g.scale(2, 2);

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function noise1(seed) {
  const r = rng(seed), v = Array.from({ length: 512 }, () => r());
  return x => {
    const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f);
    return v[i & 511] * (1 - u) + v[(i + 1) & 511] * u;
  };
}

const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

function enso(cx, cy, R, BW, seed) {
  const r = rng(seed);
  const wob = noise1(seed + 1), press = noise1(seed + 2), fine = noise1(seed + 3), band = noise1(seed + 4);
  const START = 205 * Math.PI / 180, SWEEP = 334 * Math.PI / 180;
  const NB = 260, STEPS = 560;

  g.save();
  g.translate(cx, cy); g.rotate(-.06); g.scale(1, .972);
  g.lineCap = 'butt';
  for (let j = 0; j < NB; j++) {
    const u = (j + r()) / NB * 2 - 1;           // position across the brush
    const edge = 1 - .7 * Math.pow(Math.abs(u), 4);
    // neighbour bristles run dry together: this gives streaks, not fuzz
    const q = Math.min(1, Math.max(0, (band(u * 7 + 20) - .5) * 1.5 + .5)) * .72 + r() * .28;
    const lw = .7 + r() * 1.3;
    const tStart = u * u * .02 + r() * .006;    // round, wet start
    const phase = r() * 400, jit = (r() - .5) * 1.4;
    let px = 0, py = 0;
    for (let k = 0; k <= STEPS; k++) {
      const t = k / STEPS;
      const a = START + SWEEP * t;
      const taper = (1.12 - .2 * smooth(0, .22, t)) * (1 - .34 * smooth(.62, 1, t));
      const bw = BW * taper * (.86 + .28 * press(t * 5));
      const rad = R * (1 - .04 * t) + (wob(t * 3.2) - .5) * 9 + u * bw / 2 + jit
                + (wob(t * 46 + phase) - .5) * 1.1;
      const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
      if (k > 0 && t >= tStart) {
        const ink = 1.12 - 1.04 * smooth(.3, .98, t);          // ink left on the brush
        const local = q + (fine(t * 26 + phase) - .5) * .22;
        const alpha = smooth(local - .07, local + .07, ink) * edge * .62;
        if (alpha > .004) {
          g.globalAlpha = alpha;
          g.lineWidth = lw;
          g.beginPath(); g.moveTo(px, py); g.lineTo(x, y); g.stroke();
        }
      }
      px = x; py = y;
    }
  }
  g.restore();
  g.globalAlpha = 1;
}

function seal(x, y, s) {
  g.save();
  g.translate(x, y); g.scale(s / 32, s / 32);
  g.fillStyle = ACCENT;
  g.beginPath(); g.roundRect(2, 2, 28, 28, 5); g.fill();
  g.strokeStyle = '#f6f3ec'; g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';
  g.stroke(new Path2D('M9 23V12.5c0-.6.7-.9 1.1-.5L21 23.5c.4.4 1.1.1 1.1-.5V9'));
  g.restore();
}

function draw() {
  g.fillStyle = '#f6f3ec'; g.fillRect(0, 0, W, H);
  const light = g.createRadialGradient(840, 300, 0, 840, 300, 640);
  light.addColorStop(0, 'rgba(255,253,247,.9)');
  light.addColorStop(1, 'rgba(255,253,247,0)');
  g.fillStyle = light; g.fillRect(0, 0, W, H);

  g.strokeStyle = `rgb(${INK})`;
  enso(846, 312, 196, 46, SEED);
  seal(1092, 528, 34);

  g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  g.fillStyle = `rgb(${INK})`;
  g.font = `400 96px ${SERIF}`; g.letterSpacing = '-1.8px';
  g.fillText('nanaoki', M - 3, 344);
  g.letterSpacing = '0px';

  g.font = `400 24px ${MONO}`;
  g.fillStyle = '#6f6b62';
  g.fillText('nanaoki.com', M, H - M + 4);
}

const SEED = +(new URLSearchParams(location.search).get('seed') || 5);
Promise.all([
  document.fonts.load(`400 96px "Newsreader"`),
  document.fonts.load(`400 24px "IBM Plex Mono"`),
]).then(() => document.fonts.ready).then(() => { draw(); document.title = 'ready'; });
</script>
</body>
</html>
