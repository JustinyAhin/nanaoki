<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nanaoki social card v2-b: kintsugi</title>
<!-- A fracture across a dark surface, repaired with a thin line of gold. Render: site/og/render-v2.sh -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; background: #121314; }
  canvas { display: block; width: 1200px; height: 630px; }
</style>
</head>
<body>
<canvas id="c" width="2400" height="1260"></canvas>
<script>
const W = 1200, H = 630, M = 60;
const SERIF = '"Newsreader", Georgia, serif';
const MONO = '"IBM Plex Mono", ui-monospace, Menlo, monospace';
const cv = document.getElementById('c');
const g = cv.getContext('2d');
g.scale(2, 2);

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// midpoint displacement: a fracture from a to b
function crack(ax, ay, bx, by, rough, depth, r) {
  let pts = [[ax, ay], [bx, by]];
  for (let it = 0; it < depth; it++) {
    const next = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
      const off = (r() - .5) * len * rough * Math.pow(.84, it);
      const t = .34 + r() * .32;
      next.push(pts[i], [x1 + dx * t - dy / len * off, y1 + dy * t + dx / len * off]);
    }
    next.push(pts[pts.length - 1]);
    pts = next;
  }
  return pts;
}

function trace(pts) {
  g.beginPath();
  pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
}

// stroke with a width that changes along the path
function seam(pts, w0, w1, r, style) {
  g.strokeStyle = style; g.lineCap = 'round'; g.lineJoin = 'round';
  let w = w0, target = w0;
  for (let i = 0; i < pts.length - 1; i++) {
    const t = i / (pts.length - 1);
    if (i % 6 === 0) target = (w0 + (w1 - w0) * t) * (.7 + r() * .75);
    w += (target - w) * .3;
    g.lineWidth = w;
    g.beginPath(); g.moveTo(pts[i][0], pts[i][1]); g.lineTo(pts[i + 1][0], pts[i + 1][1]); g.stroke();
  }
}

function draw() {
  const r = rng(SEED);
  g.fillStyle = '#111213'; g.fillRect(0, 0, W, H);
  const light = g.createRadialGradient(640, 250, 0, 640, 250, 760);
  light.addColorStop(0, 'rgba(58,56,52,.55)');
  light.addColorStop(.55, 'rgba(34,33,32,.3)');
  light.addColorStop(1, 'rgba(17,18,19,0)');
  g.fillStyle = light; g.fillRect(0, 0, W, H);

  const main = crack(-12, 168, W + 12, 318, .36, 7, r);
  const at = f => main[Math.round((main.length - 1) * f)];
  const j1 = at(.37), j2 = at(.61), j3 = at(.82);
  const up = crack(j1[0], j1[1], 566, -12, .4, 6, r);
  const down = crack(j2[0], j2[1], 852, H + 12, .4, 6, r);
  const hair = crack(j3[0], j3[1], 1068, 146, .4, 5, r);

  // the upper shard catches a little more light
  g.save();
  trace(main); g.lineTo(W + 12, -12); g.lineTo(-12, -12); g.closePath();
  g.fillStyle = 'rgba(255,248,230,.022)'; g.fill();
  g.restore();

  // shadow under the seam
  g.save();
  g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 5; g.lineJoin = 'round';
  g.translate(0, 1.6);
  for (const p of [main, up, down]) { trace(p); g.stroke(); }
  g.restore();

  // glow
  g.save();
  g.shadowColor = 'rgba(226,180,84,.5)'; g.shadowBlur = 44;
  g.strokeStyle = 'rgba(226,180,84,.2)'; g.lineWidth = 2; g.lineJoin = 'round';
  for (const p of [main, up, down]) { trace(p); g.stroke(); }
  g.restore();

  // gold
  const gold = g.createLinearGradient(0, 0, W, H * .5);
  [[0, '#8d6a22'], [.14, '#cfa54a'], [.3, '#f2dc9c'], [.42, '#c2963a'], [.58, '#e9cd82'],
   [.7, '#fbf0c8'], [.82, '#c79d42'], [1, '#93702a']].forEach(([s, c]) => gold.addColorStop(s, c));
  seam(up, 2.4, 1.7, r, gold);
  seam(down, 2.5, 1.8, r, gold);
  seam(main, 3, 3, r, gold);
  g.fillStyle = gold;
  for (const [j, rad] of [[j1, 3.4], [j2, 3.8]]) { g.beginPath(); g.arc(j[0], j[1], rad, 0, 7); g.fill(); }

  // a hairline that was not repaired
  g.save();
  const hg = g.createLinearGradient(j3[0], j3[1], 1068, 146);
  hg.addColorStop(0, 'rgba(236,235,230,.3)'); hg.addColorStop(1, 'rgba(236,235,230,0)');
  g.strokeStyle = hg; g.lineWidth = .8; trace(hair); g.stroke();
  g.restore();

  // type
  g.textBaseline = 'alphabetic'; g.textAlign = 'left';
  g.fillStyle = '#ecebe6';
  g.font = `400 88px ${SERIF}`; g.letterSpacing = '-1.6px';
  g.fillText('nanaoki', M - 3, 506);
  g.letterSpacing = '0px';
  g.font = `italic 400 34px ${SERIF}`;
  g.fillStyle = '#a19d93';
  g.fillText('Your agent already fixed this.', M, 562);

  g.font = `400 24px ${MONO}`; g.textAlign = 'right';
  g.fillStyle = '#8f8b82';
  g.fillText('nanaoki.com', W - M, 562);
  g.textAlign = 'left';
}

const SEED = +(new URLSearchParams(location.search).get('seed') || 8);
Promise.all([
  document.fonts.load(`400 88px "Newsreader"`),
  document.fonts.load(`italic 400 34px "Newsreader"`),
  document.fonts.load(`400 24px "IBM Plex Mono"`),
]).then(() => document.fonts.ready).then(() => { draw(); document.title = 'ready'; });
</script>
</body>
</html>
